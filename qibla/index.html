<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>بوصلة القبلة</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🕋 بوصلة القبلة</h1>
    <p class="subtitle">وجه هاتفك نحو القبلة</p>
    
    <div class="compass-wrapper">
      <!-- البوصلة  الدائرية -->
      <div class="compass-circle" id="compassCircle">
        <!-- المؤشر الثابت (رأس القبلة) -->
        <div class="needle" id="needle">
          <span class="arrow">▲</span>
          <span class="label">القبلة</span>
        </div>
        <!-- النقاط الرئيسية -->
        <div class="direction north">ش</div>
        <div class="direction east">ق</div>
        <div class="direction south">ج</div>
        <div class="direction west">غ</div>
        <!-- درجة دوران البوصلة -->
        <div class="rotation-indicator" id="rotationIndicator">0°</div>
      </div>
    </div>

    <!-- معلومات إضافية -->
    <div class="info-panel">
      <div class="info-item">
        <span class="label">اتجاه الهاتف</span>
        <span class="value" id="headingValue">--°</span>
      </div>
      <div class="info-item">
        <span class="label">زاوية القبلة</span>
        <span class="value" id="qiblaAngle">--°</span>
      </div>
      <div class="info-item">
        <span class="label">الحالة</span>
        <span class="value" id="statusText">جارٍ التحديث...</span>
      </div>
    </div>

    <!-- زر إعادة ضبط (لطلب الإذن مجدداً) -->
    <button id="resetBtn" class="reset-btn">🔄 إعادة ضبط المستشعر</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
