<script>
"use strict";
// Local preferences only; no background GPS or constant polling.
const $=id=>document.getElementById(id);
const codes=("AF AL DZ AD AO AG AR AM AU AT AZ BS BH BD BB BY BE BZ BJ BT BO BA BW BR BN BG BF BI KH CM CA CV CF TD CL CN CO KM CG CD CR CI HR CU CY CZ DK DJ DM DO EC EG SV GQ ER EE SZ ET FJ FI FR GA GM GE DE GH GR GD GT GN GW GY HT HN HU IS IN ID IR IQ IE IL IT JM JP JO KZ KE KI KP KR KW KG LA LV LB LS LR LY LI LT LU MG MW MY MV ML MT MH MR MU MX FM MD MC MN ME MA MZ MM NA NR NP NL NZ NI NE NG MK NO OM PK PW PA PG PY PE PH PL PT QA RO RU RW KN LC VC WS SM ST SA SN RS SC SL SG SK SI SB SO ZA SS ES LK SD SR SE CH SY TW TJ TZ TH TL TG TO TT TN TR TM TV UG UA AE GB US UY UZ VU VA VE VN YE ZM ZW").split(" ");
const T={
ar:{choose:"اختر دولتك للبدء بخدماتك العالمية",country:"الدولة / المنطقة",language:"اللغة",search:"ابحث عن دولة",enter:"دخول World OS",weather:"الطقس المحلي",services:"الخدمات",location:"اضغط لتحديد موقعك",status:"الموقع اختياري · اضغط زر التحديد",error:"تعذر تحديد الموقع",unavailable:"الطقس غير متاح حاليًا",pending:"هذه الخدمة قيد التجهيز لمنطقتك."},
en:{choose:"Choose your country for global services",country:"Country / Region",language:"Language",search:"Search country",enter:"Enter World OS",weather:"Local weather",services:"Services",location:"Tap to set your location",status:"Location optional · tap locate",error:"Location unavailable",unavailable:"Weather unavailable",pending:"This service is being prepared for your region."},
de:{choose:"Wähle dein Land für globale Dienste",country:"Land / Region",language:"Sprache",search:"Land suchen",enter:"World OS öffnen",weather:"Lokales Wetter",services:"Dienste",location:"Standort bestimmen",status:"Standort optional",error:"Standort nicht verfügbar",unavailable:"Wetter nicht verfügbar",pending:"Dieser Dienst wird vorbereitet."},
tr:{choose:"Küresel hizmetler için ülkenizi seçin",country:"Ülke / Bölge",language:"Dil",search:"Ülke ara",enter:"World OS'a gir",weather:"Yerel hava",services:"Hizmetler",location:"Konum belirle",status:"Konum isteğe bağlı",error:"Konum kullanılamıyor",unavailable:"Hava durumu yok",pending:"Bu hizmet hazırlanıyor."},
fr:{choose:"Choisissez votre pays",country:"Pays / Région",language:"Langue",search:"Chercher un pays",enter:"Entrer dans World OS",weather:"Météo locale",services:"Services",location:"Définir la position",status:"Position facultative",error:"Position indisponible",unavailable:"Météo indisponible",pending:"Service en préparation."},
es:{choose:"Elige tu país",country:"País / Región",language:"Idioma",search:"Buscar país",enter:"Entrar a World OS",weather:"Clima local",services:"Servicios",location:"Establecer ubicación",status:"Ubicación opcional",error:"Ubicación no disponible",unavailable:"Clima no disponible",pending:"Servicio en preparación."}
};
const services=[["🕌","Prayer times","أوقات الصلاة","salah"],["📝","Posts","إنشاء منشورات","post"],["🎓","Student assistant","مساعد الطالب","kefogpt"],["🚗","Driver assistant","مساعد السائق","map"],["🍽️","Restaurants","مطاعم","restaurants"],["📢","Eyewitness","شاهد عيان","shahed"],["🗺️","Maps","الخرائط","https://www.openstreetmap.org"],["💱","Currencies","العملات",""],["🚌","Transport","النقل",""],["🧰","Professionals","المهن",""],["📰","News","الأخبار",""],["🆘","Emergency","الطوارئ",""],["🌐","Translate","الترجمة","https://translate.google.com"],["🎮","Games · soon","ألعاب · قريباً",""],["📍","Nearby · soon","بالقرب منك · قريباً",""],["💬","Chat · soon","دردشة · قريباً",""],["🎬","Videos · soon","منصة الفيديو · قريباً",""]];
let country=localStorage.getItem("worldos-country")||"",lang=localStorage.getItem("worldos-language")||(navigator.language||"en").slice(0,2);if(!T[lang])lang="en";
function tr(){return T[lang]}
function cname(code){try{return new Intl.DisplayNames([lang],{type:"region"}).of(code)||code}catch{return code}}
function countryList(q=""){const all=codes.map(code=>({code,name:cname(code)})).sort((a,b)=>a.name.localeCompare(b.name,lang));$("country").replaceChildren();for(const c of all.filter(c=>c.name.toLowerCase().includes(q.toLowerCase())||c.code.toLowerCase().includes(q.toLowerCase()))){$("country").add(new Option(c.name,c.code))}if([...$("country").options].some(o=>o.value===country))$("country").value=country}
function locale(){document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr"}
function setup(){locale();const t=tr();$("setupIntro").textContent=t.choose;$("countryLabel").textContent=t.country;$("languageLabel").textContent=t.language;$("countrySearch").placeholder=t.search;$("enter").textContent=t.enter;$("language").value=lang;countryList($("countrySearch").value);$("home").classList.add("hidden");$("setup").classList.remove("hidden")}
function home(){locale();const t=tr();$("region").textContent=cname(country);$("weatherLabel").textContent=t.weather;$("servicesLabel").textContent=t.services;$("address").textContent=t.location;$("weatherStatus").textContent=t.status;$("detail").classList.add("hidden");$("services").replaceChildren();services.forEach(([icon,en,ar,url],i)=>{const b=document.createElement("button");b.className="tile";b.style.setProperty("--delay",Math.min(i*35,400)+"ms");const ico=document.createElement("span");ico.className="tile-icon";ico.textContent=icon;const label=document.createElement("span");label.className="tile-label";label.textContent=lang==="ar"?ar:en;b.append(ico,label);b.onclick=()=>openWorldService(url,label.textContent,icon);$("services").append(b)});$("setup").classList.add("hidden");$("home").classList.remove("hidden")}
$("language").onchange=e=>{country=$("country").value||country;lang=e.target.value;setup()};
$("countrySearch").oninput=e=>countryList(e.target.value);
$("enter").onclick=()=>{country=$("country").value;if(!country)return;localStorage.setItem("worldos-country",country);localStorage.setItem("worldos-language",lang);home();refreshIfGranted()};
$("settings").onclick=setup;$("settingsBottom").onclick=setup;
// Location permission is requested only by an explicit tap.
let lastLocationRefresh=0;
async function updateLocation(auto=false){
 if(!navigator.geolocation){$("address").textContent=tr().error;return}
 if(auto&&Date.now()-lastLocationRefresh<15*60*1000)return;
 $("weatherStatus").textContent=lang==="ar"?"جارٍ تحديث الطقس…":"Updating weather…";
 navigator.geolocation.getCurrentPosition(async p=>{
  lastLocationRefresh=Date.now();
  const {latitude,longitude}=p.coords;
  const fallback=cname(country);
  $("address").textContent=fallback;
  // Reverse geocoding uses OSM Nominatim with localized names.
  try{
   const u="https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat="+encodeURIComponent(latitude)+"&lon="+encodeURIComponent(longitude)+"&zoom=12&addressdetails=1&accept-language="+encodeURIComponent(lang);
   const response=await fetch(u,{headers:{"Accept":"application/json"}});
   if(!response.ok)throw Error("reverse");
   const data=await response.json();const a=data.address||{};
   const place=a.city||a.town||a.village||a.municipality||a.suburb||a.county||a.state||data.name;
   const region=a.state||a.country||fallback;
   $("address").textContent=place?[place,region].filter((x,i,arr)=>arr.indexOf(x)===i).join("، "):fallback;
  }catch{$("address").textContent=fallback}
  try{
   const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude="+latitude+"&longitude="+longitude+"&current=temperature_2m,weather_code&timezone=auto");
   if(!r.ok)throw Error("weather");
   const data=await r.json();$("temperature").textContent=Math.round(data.current.temperature_2m)+"°C";
   $("weatherStatus").textContent=new Date().toLocaleTimeString(lang,{hour:"2-digit",minute:"2-digit"});
   const w=data.current.weather_code;document.querySelector(".weather-icon").textContent=w>=95?"⛈️":w>=71?"❄️":w>=51?"🌧️":w>=2?"☁️":"☀️";
  }catch{$("weatherStatus").textContent=tr().unavailable}
 },()=>{if(!auto){$("address").textContent=tr().error;$("weatherStatus").textContent=tr().error}},{timeout:12000,maximumAge:900000,enableHighAccuracy:false});
}
$("locate").onclick=()=>updateLocation(false);
async function refreshIfGranted(){
 if(!country||document.visibilityState==="hidden"||!navigator.permissions)return;
 try{const permission=await navigator.permissions.query({name:"geolocation"});if(permission.state==="granted")updateLocation(true)}catch{}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")refreshIfGranted()});

$("shareFab").onclick=async()=>{const data={title:"World OS",text:"World OS · KeFo.tech",url:location.href};if(navigator.share){try{await navigator.share(data)}catch{}}else if(navigator.clipboard){await navigator.clipboard.writeText(location.href);alert("Link copied")}};
$("year").textContent=new Date().getFullYear();if(country){home();refreshIfGranted()}else setup();
// Unity interstitials must be implemented in the Android app, never inside GitHub Pages.
</script><script src="./world-services.js?v=20261108-3"></script></body></html>
