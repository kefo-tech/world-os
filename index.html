<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071b28"><meta name="description" content="World OS — local services for the world"><link rel="manifest" href="manifest.json"><title>World OS · KeFo.tech</title>
<style>
:root{color-scheme:dark;--bg:#071722;--panel:#102d3d;--line:#2b5264;--cyan:#71ddf8;--ink:#eaf8ff;--muted:#9db8c7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#174257,#071722 70%);color:var(--ink);font:15px system-ui,Tahoma,Arial;min-height:100dvh}button,select,input{font:inherit}button{cursor:pointer}header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}.brand{font-weight:900;letter-spacing:2px;font-size:21px;color:var(--cyan)}.shell{max-width:650px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}.content{padding:14px;flex:1}.panel{background:linear-gradient(140deg,#153b4c,#0d2838);border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:14px}.weather{display:flex;justify-content:space-between;align-items:center;gap:12px}.temp{font-size:34px;font-weight:800}.muted{color:var(--muted);font-size:13px}.address{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.tile{min-height:92px;border:1px solid var(--line);background:#113447;border-radius:15px;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px}.tile span:first-child{font-size:27px}.tile:active{transform:scale(.98)}.smallbtn{background:#164457;border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--ink)}.primary{background:#52c9eb;color:#05202e;border:0;border-radius:12px;padding:13px;font-weight:800;width:100%;margin-top:14px}.field{width:100%;background:#092332;border:1px solid #447083;border-radius:10px;padding:13px;color:white;margin:8px 0 12px}.setup{padding:25px 18px;display:flex;flex-direction:column;justify-content:center;flex:1}.setup h1{text-align:center;font-size:32px;letter-spacing:3px;color:var(--cyan)}.setup p{text-align:center;color:var(--muted)}label{font-weight:600;font-size:13px}footer{padding:16px;text-align:center;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}.hidden{display:none!important}.servicehead{display:flex;align-items:center;gap:12px}.note{line-height:1.7}.badge{color:var(--cyan)}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="shell">
<section id="setup" class="setup hidden"><h1>🌐 WORLD OS</h1><p id="setupIntro">Choose your country to personalize services</p><div class="panel"><label id="countryLabel" for="countrySearch">Country / Region</label><input id="countrySearch" class="field" type="search" autocomplete="off" placeholder="Search country"><select id="country" class="field" size="7" aria-label="Country"></select><label id="languageLabel" for="language">Language</label><select id="language" class="field"><option value="en">English</option><option value="ar">العربية</option><option value="de">Deutsch</option><option value="tr">Türkçe</option><option value="fr">Français</option><option value="es">Español</option></select><button id="enter" class="primary">Continue →</button></div></section>
<section id="home" class="hidden"><header><div><div class="brand">🌐 WORLD OS</div><div id="region" class="muted"></div></div><button class="smallbtn" id="settings" aria-label="Change country">⚙️</button></header><main class="content"><section class="panel"><div class="weather"><div><div id="weatherLabel" class="muted">Local weather</div><div class="temp" id="temperature">--°</div><div id="weatherStatus" class="muted">Location optional</div></div><div style="font-size:45px">🌤️</div></div><div class="address">📍 <span id="address">Location not enabled</span><button class="smallbtn" id="locate" style="float:inline-end">⌖</button></div></section><h3 id="servicesLabel">Services</h3><div class="grid" id="services"></div><section id="detail" class="panel hidden" style="margin-top:14px"></section></main><footer>© <span id="year"></span> KeFo.tech · World OS</footer></section></div>
<script>
"use strict";
// Country list: ISO 3166-1 alpha-2 codes. Names are localized with Intl.DisplayNames.
const codes=("AF AL DZ AD AO AG AR AM AU AT AZ BS BH BD BB BY BE BZ BJ BT BO BA BW BR BN BG BF BI KH CM CA CV CF TD CL CN CO KM CG CD CR CI HR CU CY CZ DK DJ DM DO EC EG SV GQ ER EE SZ ET FJ FI FR GA GM GE DE GH GR GD GT GN GW GY HT HN HU IS IN ID IR IQ IE IL IT JM JP JO KZ KE KI KP KR KW KG LA LV LB LS LR LY LI LT LU LU? MG MW MY MV ML MT MH MR MU MX FM MD MC MN ME MA MZ MM NA NR NP NL NZ NI NE NG MK NO OM PK PW PA PG PY PE PH PL PT QA RO RU RW KN LC VC WS SM ST SA SN RS SC SL SG SK SI SB SO ZA SS ES LK SD SR SE CH SY TW TJ TZ TH TL TG TO TT TN TR TM TV UG UA AE GB US UY UZ VU VA VE VN YE ZM ZW").split(" ").filter(c=>/^[A-Z]{2}$/.test(c));
const uniqueCodes=[...new Set(codes)];
const langs={en:{choose:"Choose your country",country:"Country / Region",language:"Language",continue:"Continue",search:"Search country",weather:"Local weather",services:"Services",location:"Location not enabled",request:"Use location",unavailable:"Weather unavailable",noLocation:"Location permission denied or unavailable",notready:"This service is being prepared for your region.",offline:"Live data requires an internet connection."},ar:{choose:"اختر دولتك",country:"الدولة / المنطقة",language:"اللغة",continue:"دخول World OS",search:"ابحث عن دولة",weather:"الطقس المحلي",services:"الخدمات",location:"الموقع غير مفعل",request:"تحديد الموقع",unavailable:"الطقس غير متاح",noLocation:"تعذر الحصول على إذن الموقع",notready:"هذه الخدمة قيد التجهيز لمنطقتك.",offline:"البيانات المباشرة تتطلب اتصالًا بالإنترنت."},de:{choose:"Land auswählen",country:"Land / Region",language:"Sprache",continue:"Weiter",search:"Land suchen",weather:"Lokales Wetter",services:"Dienste",location:"Standort nicht aktiviert",request:"Standort",unavailable:"Wetter nicht verfügbar",noLocation:"Standort nicht verfügbar",notready:"Dieser Dienst wird vorbereitet.",offline:"Live-Daten benötigen Internet."},tr:{choose:"Ülkenizi seçin",country:"Ülke / Bölge",language:"Dil",continue:"Devam et",search:"Ülke ara",weather:"Yerel hava",services:"Hizmetler",location:"Konum kapalı",request:"Konum",unavailable:"Hava durumu yok",noLocation:"Konum kullanılamıyor",notready:"Bu hizmet hazırlanıyor.",offline:"Canlı veriler internet gerektirir."},fr:{choose:"Choisissez votre pays",country:"Pays / Région",language:"Langue",continue:"Continuer",search:"Rechercher un pays",weather:"Météo locale",services:"Services",location:"Position désactivée",request:"Position",unavailable:"Météo indisponible",noLocation:"Position indisponible",notready:"Service en préparation.",offline:"Les données en direct nécessitent Internet."},es:{choose:"Elige tu país",country:"País / Región",language:"Idioma",continue:"Continuar",search:"Buscar país",weather:"Clima local",services:"Servicios",location:"Ubicación desactivada",request:"Ubicación",unavailable:"Clima no disponible",noLocation:"Ubicación no disponible",notready:"Servicio en preparación.",offline:"Los datos en vivo requieren internet."}};
const services=[["🗺️","Maps","الخرائط","https://www.openstreetmap.org"],["💱","Currencies","العملات",""],["🚌","Transport","النقل",""],["🧰","Professionals","المهن",""],["📰","News","الأخبار",""],["🆘","Emergency","الطوارئ",""],["🌐","Translate","الترجمة","https://translate.google.com"],["🧮","Calculator","الحاسبة",""],["🧭","Explore","استكشف",""]];
const $=id=>document.getElementById(id);
let selected=localStorage.getItem("worldos-country")||"",lang=localStorage.getItem("worldos-language")||(navigator.language||"en").slice(0,2);if(!langs[lang])lang="en";
function dict(){return langs[lang]||langs.en}
function countryName(code){try{return new Intl.DisplayNames([lang],{type:"region"}).of(code)||code}catch{return code}}
function fillCountries(q=""){const list=uniqueCodes.map(code=>({code,name:countryName(code)})).sort((a,b)=>a.name.localeCompare(b.name,lang));$("country").replaceChildren();for(const c of list.filter(c=>c.name.toLocaleLowerCase().includes(q.toLocaleLowerCase())||c.code.toLowerCase().includes(q.toLowerCase()))){const opt=new Option(c.name,c.code);$("country").add(opt)}if([...$("country").options].some(o=>o.value===selected))$("country").value=selected;else if(!$("country").value&&$("country").options.length)$("country").selectedIndex=0}
function setup(){const t=dict();$("setupIntro").textContent=t.choose;$("countryLabel").textContent=t.country;$("languageLabel").textContent=t.language;$("countrySearch").placeholder=t.search;$("enter").textContent=t.continue;$("language").value=lang;fillCountries();$("setup").classList.remove("hidden");$("home").classList.add("hidden")}
function home(){const t=dict();document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";$("region").textContent=countryName(selected);$("weatherLabel").textContent=t.weather;$("servicesLabel").textContent=t.services;$("address").textContent=t.location;$("locate").title=t.request;$("detail").classList.add("hidden");$("services").replaceChildren();services.forEach(([icon,en,ar,url])=>{const b=document.createElement("button");b.className="tile";const label=lang==="ar"?ar:en;b.innerHTML="<span>"+icon+"</span><span></span>";b.lastChild.textContent=label;b.onclick=()=>{if(url){window.open(url,"_blank","noopener,noreferrer");return}const detail=$("detail");detail.replaceChildren();const h=document.createElement("h3");h.textContent=icon+" "+label;const p=document.createElement("p");p.className="note muted";p.textContent=t.notready;detail.append(h,p);detail.classList.remove("hidden");detail.scrollIntoView({behavior:"smooth",block:"nearest"})};$("services").append(b)});$("setup").classList.add("hidden");$("home").classList.remove("hidden")}
$("language").onchange=e=>{lang=e.target.value;fillCountries($("countrySearch").value);setup()};
$("countrySearch").oninput=e=>fillCountries(e.target.value);
$("enter").onclick=()=>{selected=$("country").value;if(!selected)return;localStorage.setItem("worldos-country",selected);localStorage.setItem("worldos-language",lang);home()};
$("settings").onclick=setup;
$("locate").onclick=()=>{const t=dict();if(!navigator.geolocation){$("address").textContent=t.noLocation;return}navigator.geolocation.getCurrentPosition(async pos=>{const {latitude,longitude}=pos.coords;$("address").textContent=latitude.toFixed(3)+", "+longitude.toFixed(3);try{const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude="+latitude+"&longitude="+longitude+"&current=temperature_2m&timezone=auto");if(!r.ok)throw Error();const j=await r.json();$("temperature").textContent=Math.round(j.current.temperature_2m)+"°C";$("weatherStatus").textContent=new Date().toLocaleTimeString(lang,{hour:"2-digit",minute:"2-digit"})}catch{$("weatherStatus").textContent=t.unavailable}},{enableHighAccuracy:false,timeout:10000,maximumAge:900000},e=>{$("address").textContent=t.noLocation},{timeout:10000,maximumAge:900000,enableHighAccuracy:false})};
$("year").textContent=new Date().getFullYear();if(selected)home();else setup();
// Native Android ad integration is intentionally separate from the web page.
// The Android host should request a Unity interstitial at natural transitions,
// capped at one successful show per local calendar day per installation.
</script></body></html>
